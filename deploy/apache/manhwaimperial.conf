<VirtualHost *:80>
    ServerName manhwaimperial.site
    ServerAlias www.manhwaimperial.site admin.manhwaimperial.site

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass        /socket.io/ http://127.0.0.1:3000/socket.io/ upgrade=websocket retry=0 timeout=60
    ProxyPassReverse /socket.io/ http://127.0.0.1:3000/socket.io/
    ProxyPass        /api/ http://127.0.0.1:3000/api/ retry=0 timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/
    ProxyPass        / http://127.0.0.1:3001/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/manhwaimperial-error.log
    CustomLog ${APACHE_LOG_DIR}/manhwaimperial-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName ai.manhwaimperial.site

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass        / http://127.0.0.1:3003/ retry=0 timeout=180
    ProxyPassReverse / http://127.0.0.1:3003/

    ErrorLog ${APACHE_LOG_DIR}/manhwaimperial-ai-error.log
    CustomLog ${APACHE_LOG_DIR}/manhwaimperial-ai-access.log combined
</VirtualHost>
