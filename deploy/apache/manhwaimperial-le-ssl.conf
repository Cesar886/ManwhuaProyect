<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName manhwaimperial.site
    ServerAlias www.manhwaimperial.site admin.manhwaimperial.site

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ProxyPass        /socket.io/ http://127.0.0.1:3000/socket.io/ upgrade=websocket retry=0 timeout=60
    ProxyPassReverse /socket.io/ http://127.0.0.1:3000/socket.io/
    ProxyPass        /api/popular-home http://127.0.0.1:3001/api/popular-home retry=0 timeout=30
    ProxyPassReverse /api/popular-home http://127.0.0.1:3001/api/popular-home
    ProxyPass        /api/personalized-home http://127.0.0.1:3001/api/personalized-home retry=0 timeout=30
    ProxyPassReverse /api/personalized-home http://127.0.0.1:3001/api/personalized-home
    ProxyPass        /api/smart-home http://127.0.0.1:3001/api/smart-home retry=0 timeout=30
    ProxyPassReverse /api/smart-home http://127.0.0.1:3001/api/smart-home
    ProxyPass        /api/og http://127.0.0.1:3001/api/og retry=0 timeout=30
    ProxyPassReverse /api/og http://127.0.0.1:3001/api/og
    ProxyPass        /api/indexnow http://127.0.0.1:3001/api/indexnow retry=0 timeout=30
    ProxyPassReverse /api/indexnow http://127.0.0.1:3001/api/indexnow
    ProxyPass        /api/revalidate http://127.0.0.1:3001/api/revalidate retry=0 timeout=30
    ProxyPassReverse /api/revalidate http://127.0.0.1:3001/api/revalidate
    ProxyPass        /api/ http://127.0.0.1:3000/api/ retry=0 timeout=120
    ProxyPassReverse /api/ http://127.0.0.1:3000/api/
    ProxyPass        / http://127.0.0.1:3001/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/manhwaimperial-error.log
    CustomLog ${APACHE_LOG_DIR}/manhwaimperial-access.log combined


Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/manhwaimperial.site/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/manhwaimperial.site/privkey.pem
</VirtualHost>
</IfModule>
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ai.manhwaimperial.site

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    ProxyPass        / http://127.0.0.1:3003/ retry=0 timeout=180
    ProxyPassReverse / http://127.0.0.1:3003/

    ErrorLog ${APACHE_LOG_DIR}/manhwaimperial-ai-error.log
    CustomLog ${APACHE_LOG_DIR}/manhwaimperial-ai-access.log combined

SSLCertificateFile /etc/letsencrypt/live/manhwaimperial.site/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/manhwaimperial.site/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
